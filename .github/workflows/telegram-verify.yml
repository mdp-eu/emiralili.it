name: Telegram Verification

on:
  push:
    branches:
      - main
    paths:
      - social/telegram-verify.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Telegram bot and channel permissions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@emiralili"
          PUBLISH_MODE: verify
        run: python scripts/telegram_publish.py
