name: Authority Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/authority-build.yml'
      - 'scripts/build_authority.py'
      - 'authority.css'
      - 'menu.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build entity SEO and topic hubs
        run: python scripts/build_authority.py
      - name: Commit generated authority structure
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' sitemap.xml
          git commit -m 'Build topic authority pages and author linking'
          git push
