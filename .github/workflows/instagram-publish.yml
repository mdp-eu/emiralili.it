name: Instagram Publisher

on:
  push:
    branches:
      - main
    paths:
      - social/instagram-post.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read social post identifier
        id: config
        run: |
          python - <<'PY'
          import json
          import os
          with open("social/instagram-post.json", encoding="utf-8") as handle:
              publish_id = str(json.load(handle)["publish_id"]).strip()
          if not publish_id or any(ch not in "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_" for ch in publish_id):
              raise SystemExit("Invalid publish_id")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish_id={publish_id}\n")
          PY

      - name: Check duplicate protection
        if: github.event_name == 'push'
        id: published
        uses: actions/cache@v4
        with:
          path: .instagram-published
          key: instagram-published-${{ steps.config.outputs.publish_id }}

      - name: Publish approved post automatically
        if: github.event_name == 'push' && steps.published.outputs.cache-hit != 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLISH_MODE: publish
          AUTO_PUBLISH: "true"
          SOCIAL_POST_FILE: social/instagram-post.json
        run: |
          python scripts/instagram_publish.py
          mkdir -p .instagram-published
          printf '%s\n' "${{ steps.config.outputs.publish_id }}" > ".instagram-published/${{ steps.config.outputs.publish_id }}"

      - name: Verify Instagram credentials
        if: github.event_name == 'workflow_dispatch'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLISH_MODE: verify
        run: python scripts/instagram_publish.py
