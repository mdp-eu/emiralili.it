name: Instagram Publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Verify credentials or publish one image post"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish
      image_url:
        description: "Public HTTPS image URL (publish mode only)"
        required: false
        default: "https://raw.githubusercontent.com/mdp-eu/emiralili.it/main/assets/social/likud-primarie-instagram.jpg"
        type: string
      caption:
        description: "Instagram caption (publish mode only)"
        required: false
        default: |-
          PRIMARIE LIKUD: NETANYAHU CONSOLIDA IL PARTITO, MA RISCHIA DI PERDERE IL CENTRO

          Le primarie hanno rafforzato il controllo interno di Netanyahu e premiato continuità, apparato e fedeltà. Ma la disciplina del partito non equivale a una maggioranza nazionale.

          La sfida del 27 ottobre si deciderà fuori dal perimetro degli iscritti: tra elettori moderati, gestione di Gaza, Cisgiordania, riforma giudiziaria e dipendenza dai partiti ultranazionalisti e religiosi.

          Analisi completa:
          https://emiralili.it/primarie-likud-netanyahu-elezioni-israele-2026.html

          Emir Alili — Presidente MDP

          Foto della Knesset: Joshua Paquin, CC BY 2.0.

          #Geopolitica #Israele #Likud #Netanyahu #MedioOriente
        type: string
      confirmation:
        description: "Type PUBLISH to authorize a real post"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify or publish
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLISH_MODE: ${{ inputs.mode }}
          IMAGE_URL: ${{ inputs.image_url }}
          CAPTION: ${{ inputs.caption }}
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
        run: python scripts/instagram_publish.py
