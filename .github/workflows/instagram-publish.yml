name: Instagram Publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Verify credentials or publish the approved Instagram post"
        required: true
        default: publish
        type: choice
        options:
          - publish
          - verify
      confirmation:
        description: "Required: type PUBLISH to authorize this real post"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify or publish
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLISH_MODE: ${{ inputs.mode }}
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
          IMAGE_URL: "https://raw.githubusercontent.com/mdp-eu/emiralili.it/main/assets/social/likud-primarie-instagram.jpg"
          CAPTION: |-
            PRIMARIE LIKUD: NETANYAHU CONSOLIDA IL PARTITO, MA RISCHIA DI PERDERE IL CENTRO

            Le primarie hanno rafforzato il controllo interno di Netanyahu, premiando continuità, apparato e fedeltà.

            Ma dominare il partito non significa avere già conquistato la maggioranza del Paese. La sfida elettorale si deciderà tra gestione della guerra a Gaza, Cisgiordania, riforma giudiziaria, voto moderato e dipendenza dai partiti ultranazionalisti e religiosi.

            Nell’analisi completa ricostruisco gli equilibri interni al Likud e le conseguenze per Israele e il Medio Oriente.

            #Geopolitica #Israele #Likud #Netanyahu #MedioOriente
        run: python scripts/instagram_publish.py
